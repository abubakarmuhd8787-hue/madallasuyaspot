<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track your order - Madalla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Madalla Ice Products and Suya Spot</h1>
    <a class="cart-btn" href="index.html">Shop</a>
  </header>

  <main class="narrow">
    <h2>Track your order</h2>

    <form id="trackForm">
      <label>Order number

      <button type="submit" class="primary">Track</button>
    </form>

    <div id="result"></div>
  </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="track.js"></script>
</body>
