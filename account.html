<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My account - Madalla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>My account</h1>
    <div class="top-actions">
      <a class="cart-btn" href="index.html">Shop</a>
      <button id="logoutBtn" class="cart-btn">Log out</button>
    </div>
  </header>

  <section class="hero">
    <p>Your details and your orders</p>
  </section>

  <main class="narrow">
    <h2>My details</h2>
    <p class="hint">These are filled in for you at checkout.</p>
    <form id="profileForm">
      <label>Full name
        <input type="text" id="pName" required>
      </label>
      <label>Phone number
        <input type="tel" id="pPhone" required>
      </label>
      <label>Delivery address
        <textarea id="pAddress" rows="2"></textarea>
      </label>
      <button type="submit" class="primary">Save my details</button>
      <p id="profileMsg" class="ok-text"></p>
    </form>

    <h2>My orders</h2>
    <div id="orderList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="banner.js"></script>
  <script src="account.js"></script>
</body>
</html>
